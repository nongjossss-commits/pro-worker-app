<!DOCTYPE html>
<html>
<head>
    <title>Verify Import Link</title>
</head>
<body>
    <!-- Hidden Inputs -->
    <input type="hidden" id="modal_employer_id">
    <input type="hidden" id="modal_work_type_id">
    <input type="hidden" id="modal_production_order_id">
    <input type="hidden" id="add_employee_is_pre_production" value="0">

    <!-- Import Button -->
    <a href="#" id="btn-go-import">Go to Import Page</a>

    <!-- Mock Route -->
    <script>
        // Mock route generation
        const routeBase = '/employees/import';
    </script>

    <!-- The Function to Test -->
    <script>
    window.openAddEmployeeModal = function(orderId, employerId, workTypeId, workTypeSlug, context = 'workflow') {
        document.getElementById('modal_employer_id').value = employerId || '';
        document.getElementById('modal_work_type_id').value = workTypeId || '';
        document.getElementById('modal_production_order_id').value = orderId || ''; // Empty if Global Add

        // Set Pre-Production Flag based on context
        const isPreProduction = (context === 'production');
        document.getElementById('add_employee_is_pre_production').value = isPreProduction ? '1' : '0';

        // Dispatch event (Mocked)
        console.log('Dispatch event set-employer-id');

        // Setup Import Link with return_to parameter and work_type_id
        // NOTE: In Blade it was {{ route(...) }}, here we use routeBase variable
        const importUrl = `${routeBase}?production_id=${orderId || ''}&employer_id=${employerId || ''}&work_type_id=${workTypeId || ''}&return_to=${context}`;
        document.getElementById('btn-go-import').href = importUrl;
    }
    </script>
</body>
</html>
