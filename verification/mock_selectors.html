<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock Hide Employer</title>
    <style>
        .d-none { display: none !important; }
        .card { border: 1px solid black; padding: 10px; margin: 10px; }
        .active { background-color: red; color: white; }
    </style>
</head>
<body>

    <button id="filter-not-started" onclick="toggleFilter('not_started')">Filter Not Started</button>

    <!-- Employer 1: Mixed -->
    <div class="card" id="employer-card-1">
        <h3>Employer 1</h3>
        <div class="employee-card-wrapper" data-employer-id="1" data-is-not-started="true">Emp 1 (Not Started)</div>
        <div class="employee-card-wrapper" data-employer-id="1" data-is-not-started="false">Emp 2 (Done)</div>
    </div>

    <!-- Employer 2: Only Done -->
    <div class="card" id="employer-card-2">
        <h3>Employer 2</h3>
        <div class="employee-card-wrapper" data-employer-id="2" data-is-not-started="false">Emp 3 (Done)</div>
    </div>

    <!-- Employer 3: Empty -->
    <div class="card" id="employer-card-3">
        <h3>Employer 3 (Empty)</h3>
    </div>

    <script>
        let currentStepFilter = null;

        function toggleFilter(filterKey) {
            if (currentStepFilter === filterKey) {
                currentStepFilter = null;
                document.getElementById('filter-not-started').classList.remove('active');
            } else {
                currentStepFilter = filterKey;
                document.getElementById('filter-not-started').classList.add('active');
            }
            applyFilters();
        }

        // NEW LOGIC
        function applyFilters() {
            const cards = document.querySelectorAll('.employee-card-wrapper');
            let visibleCount = 0;

            cards.forEach(card => {
                const highestStepId = card.dataset.highestStepId; // Not used in this test
                const isNotStarted = card.dataset.isNotStarted === 'true';

                let show = true;

                if (currentStepFilter) {
                    if (currentStepFilter === 'not_started') {
                        if (!isNotStarted) show = false;
                    } else {
                        // Check if highest step matches filter
                        if (highestStepId != currentStepFilter) show = false;
                    }
                }

                if (show) {
                    card.classList.remove('d-none');
                    visibleCount++;
                } else {
                    card.classList.add('d-none');
                }
            });

            // Update Employer Visibility
            document.querySelectorAll('[id^="employer-card-"]').forEach(empCard => {
                const visibleEmployees = empCard.querySelectorAll('.employee-card-wrapper:not(.d-none)');

                if (currentStepFilter !== null) {
                    // Filter is active: Hide if no matches
                    if (visibleEmployees.length === 0) {
                        empCard.classList.add('d-none');
                    } else {
                        empCard.classList.remove('d-none');
                    }
                } else {
                    // No filter active: Always show employer
                    empCard.classList.remove('d-none');
                }
            });
        }
    </script>
</body>
</html>
