<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mock Renewal Index</title>
    <!-- CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .container-fluid { padding: 20px; }
        .card { border-radius: 10px; }
    </style>
</head>
<body class="bg-light">
    <div class="container-fluid">
        <!-- Actions Bar -->
        <div class="card shadow-sm border-0 mb-4 bg-white">
            <div class="card-body p-3">
                <div class="d-flex flex-column flex-lg-row justify-content-between align-items-center gap-3">
                    <h4 class="mb-0 text-primary fw-bold text-nowrap"><i class="bi bi-people-fill me-2"></i>Renewal Resolution</h4>

                    <form action="#" class="d-flex flex-grow-1 w-100" style="max-width: 600px;">
                        <div class="input-group input-group-lg">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-search text-muted"></i></span>
                            <input type="text" class="form-control bg-light border-start-0" placeholder="Search employee or employer...">
                            <button class="btn btn-primary" type="button">Search</button>
                        </div>
                    </form>

                    <div class="d-flex gap-2 flex-wrap justify-content-end">
                        <a href="#" class="btn btn-warning text-white fw-bold">
                            <i class="bi bi-plus-lg me-1"></i> New Employee
                        </a>

                        <!-- NEW IMPORT BUTTON -->
                        <a href="#" class="btn btn-success fw-bold">
                            <i class="bi bi-file-earmark-spreadsheet me-1"></i> Import
                        </a>

                        <!-- IMPORT BY EXPIRY BUTTON -->
                        <button class="btn btn-success fw-bold" data-bs-toggle="modal">
                            <i class="bi bi-calendar-check me-1"></i> Configuration / Import by Expiry
                        </button>

                        <a href="#" class="btn btn-secondary fw-bold">
                            <i class="bi bi-trash-fill me-1"></i> Trash
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
