<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock Employee Cards</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        .employee-card-production {
            transition: transform 0.2s;
        }
        .employee-card-production:hover {
            transform: translateY(-2px);
            box-shadow: 0 .5rem 1rem rgba(0,0,0,.15)!important;
        }
    </style>
</head>
<body class="bg-light p-4">
    <div class="container">
        <h3>Employee Cards (Production)</h3>
        <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-3">
            <!-- Mock Card 1: Standard Employee -->
            <div class="col">
                <div class="card h-100 border shadow-sm employee-card-production">
                    <div class="card-body d-flex align-items-start">
                        <img src="https://via.placeholder.com/50" alt="Photo" class="rounded-circle me-3 border" style="width: 50px; height: 50px; object-fit: cover;">
                        <div class="flex-grow-1 overflow-hidden">
                            <div class="d-flex justify-content-between align-items-start">
                                <h6 class="fw-bold mb-0 text-truncate">นาย สมชาย ใจดี</h6>
                                <button type="button" class="btn btn-link p-0 text-primary btn-preview"><i class="bi bi-search"></i></button>
                            </div>
                            <div class="small text-muted mb-1 text-truncate">Somchai Jaidee</div>
                            <div class="d-flex align-items-center small mb-1">
                                <i class="bi bi-pass me-1 text-secondary"></i>
                                <span class="me-2">AA1234567</span>
                                <span class="text-secondary">Thai</span>
                            </div>
                            <div class="small text-muted mb-2"><i class="bi bi-building me-1"></i> Tech Corp Co., Ltd.</div>
                            <div><span class="badge bg-secondary">Pending Workflow</span></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Mock Card 2: Pending Confirmation -->
            <div class="col">
                <div class="card h-100 border shadow-sm employee-card-production">
                    <div class="card-body d-flex align-items-start">
                        <img src="https://via.placeholder.com/50" alt="Photo" class="rounded-circle me-3 border" style="width: 50px; height: 50px; object-fit: cover;">
                        <div class="flex-grow-1 overflow-hidden">
                            <div class="d-flex justify-content-between align-items-start">
                                <h6 class="fw-bold mb-0 text-truncate">Ms. Jane Doe</h6>
                                <button type="button" class="btn btn-link p-0 text-primary btn-preview"><i class="bi bi-search"></i></button>
                            </div>
                            <div class="small text-muted mb-1 text-truncate">Jane Doe</div>
                            <div class="d-flex align-items-center small mb-1">
                                <i class="bi bi-pass me-1 text-secondary"></i>
                                <span class="me-2">P987654321</span>
                                <span class="text-secondary">USA</span>
                            </div>
                            <div class="small text-muted mb-2"><i class="bi bi-building me-1"></i> Global Services Inc.</div>
                            <div><span class="badge bg-warning text-dark"><i class="bi bi-hourglass-split me-1"></i>Pending Confirmation</span></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
