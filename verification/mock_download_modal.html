<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Center Mock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
    <div class="container mt-5">
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#downloadCenterModal">
            Open Download Center
        </button>
    </div>

    <!-- Download Center Modal -->
    <div class="modal fade" id="downloadCenterModal" tabindex="-1" aria-labelledby="downloadCenterModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="downloadCenterModalLabel">Download Center</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p class="text-muted">Background tasks are listed here. Click 'Download' when ready.</p>
                    <div class="table-responsive">
                        <table class="table table-sm table-hover">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Type</th>
                                    <th>Date</th>
                                    <th>Status</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="downloadTasksTableBody">
                                <!-- Mock Data Injected via JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-outline-primary" id="btnRefreshDownloads">Refresh</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const tbody = document.getElementById('downloadTasksTableBody');
            const tasks = [
                { id: 1, type: 'zip', created_at: '2023-10-27T10:00:00', status: 'completed' },
                { id: 2, type: 'pdf', created_at: '2023-10-27T10:05:00', status: 'processing' },
                { id: 3, type: 'pdf', created_at: '2023-10-27T10:10:00', status: 'failed', error_message: 'FPDI Error: File damaged' }
            ];

            function renderTasks() {
                tbody.innerHTML = '';
                tasks.forEach(task => {
                    let badgeClass = 'bg-secondary';
                    if (task.status === 'completed') badgeClass = 'bg-success';
                    else if (task.status === 'processing') badgeClass = 'bg-warning text-dark';
                    else if (task.status === 'failed') badgeClass = 'bg-danger';

                    let actionBtn = '';
                    if (task.status === 'completed') {
                        actionBtn = `<a href="#" class="btn btn-sm btn-success"><i class="bi bi-download"></i> Download</a>`;
                    } else if (task.status === 'failed') {
                        // This is the Logic I changed
                        actionBtn = `
                            <span class="text-danger fw-bold">Failed</span>
                            <i class="bi bi-info-circle ms-1 text-muted" data-bs-toggle="tooltip" title="${task.error_message}"></i>
                        `;
                    } else {
                        actionBtn = `<span class="text-muted spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> <span class="text-muted">Processing...</span>`;
                    }

                    const date = new Date(task.created_at).toLocaleString();

                    tbody.innerHTML += `
                        <tr>
                            <td>${task.id}</td>
                            <td>${task.type.toUpperCase()}</td>
                            <td>${date}</td>
                            <td><span class="badge ${badgeClass}">${task.status}</span></td>
                            <td>${actionBtn}</td>
                        </tr>
                    `;
                });

                // Re-initialize tooltips
                var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'))
                var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
                  return new bootstrap.Tooltip(tooltipTriggerEl)
                })
            }

            const modal = document.getElementById('downloadCenterModal');
            modal.addEventListener('shown.bs.modal', renderTasks);
        });
    </script>
</body>
</html>
