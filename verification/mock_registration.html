
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="csrf-token" content="test-token">
        <title>Registration Resolution</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    </head>
    <body class="bg-light">
        <div class="container-fluid py-4">
            <!-- Headers Mock -->
            <div class="card mb-4">
                <div class="card-body">
                    <h5>Workflow Progress</h5>
                    <div class="d-flex gap-2" id="global-stats-container">
                        <div class="border rounded p-2 text-center">
                            <div class="fw-bold">Step A</div>
                            <span class="badge bg-success rounded-pill global-stat-badge" data-step-id="1">0</span>
                        </div>
                         <div class="border rounded p-2 text-center">
                            <div class="fw-bold">Step B</div>
                            <span class="badge bg-success rounded-pill global-stat-badge" data-step-id="2">0</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Employee Card Mock -->
            <div class="card mb-3 border shadow-sm" id="employee-card-101">
                <div class="card-body p-3">
                    <h6>Somchai Test</h6>
                    <div class="mt-3">
                        <label>Workflow Progress</label>
                        <div class="d-flex gap-1 flex-wrap">
                            <button class="btn btn-sm btn-outline-secondary" onclick="toggleStep(101, 1, true)" data-step-id="1">Step A</button>
                            <button class="btn btn-sm btn-outline-secondary" onclick="toggleStep(101, 2, true)" data-step-id="2">Step B</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Finance Modal Button -->
             <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#financeModal">Open Finance</button>

            <!-- Finance Modal Mock -->
            <div class="modal fade" id="financeModal" tabindex="-1">
                <div class="modal-dialog modal-xl">
                    <div class="modal-content">
                        <div class="modal-header"><h5>Finance</h5></div>
                        <div class="modal-body" x-data="financialManager()">
                            <button class="btn btn-primary" @click="saveFinancialData()">Save Pricing</button>
                            <div id="toast-area"></div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <script>
            // Mock Toggle Step
            function toggleStep(empId, stepId, completed) {
                // Mock Fetch behavior
                console.log(`Toggling Step ${stepId} for Emp ${empId} to ${completed}`);

                // Simulate success response update
                const btn = document.querySelector(`button[data-step-id="${stepId}"]`);
                if(completed) {
                    btn.classList.remove('btn-outline-secondary');
                    btn.classList.add('btn-success');
                    btn.innerHTML = 'Step ' + (stepId == 1 ? 'A' : 'B') + ' <i class="bi bi-check"></i>';
                    btn.setAttribute('onclick', `toggleStep(${empId}, ${stepId}, false)`);
                } else {
                    btn.classList.remove('btn-success');
                    btn.classList.add('btn-outline-secondary');
                    btn.innerHTML = 'Step ' + (stepId == 1 ? 'A' : 'B');
                    btn.setAttribute('onclick', `toggleStep(${empId}, ${stepId}, true)`);
                }
            }

            // Mock Show Toast
            function showToast(msg, type) {
                const area = document.getElementById('toast-area');
                area.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
            }

            // Mock Financial Manager
            function financialManager() {
                return {
                    saveFinancialData() {
                        // Mock Fetch
                        console.log('Saving...');
                        // Simulate Success
                        setTimeout(() => {
                            if(typeof showToast === 'function') {
                                showToast('Pricing Settings Saved', 'success');
                            } else {
                                alert('Pricing Settings Saved');
                            }
                        }, 500);
                    }
                }
            }
        </script>
    </body>
    </html>
