<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="mock-csrf-token">
    <title>Verification - External Employees</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.12.0/dist/cdn.min.js"></script>
</head>
<body class="bg-light p-4">

    <div class="container">
        <h1>Verification: External Employees Button</h1>

        <!-- MOCKED Reply Box from show.blade.php -->
        <div class="card mb-4" id="reply-box" x-data="hybridAttachmentManager({ employerId: 123 })">
            <div class="card-header"><h5 class="mb-0"><i class="bi bi-send me-2"></i> ตอบกลับ / ส่งข้อความ</h5></div>
            <div class="card-body">
                <input type="file" multiple class="d-none" x-ref="generalFileInput" @change="handleGeneralFileUpload($event)">

                <form x-ref="replyForm" method="POST">

                    <!-- Attachment Basket -->
                    <div class="mb-3">
                        <label class="form-label">สิ่งที่แนบมา (<span x-text="totalItemsCount()"></span> รายการ):</label>

                        <div class="list-group" style="max-height: 250px; overflow-y: auto;">
                            <template x-if="totalItemsCount() === 0">
                                <div class="list-group-item text-muted fst-italic">ยังไม่มีรายการที่แนบ</div>
                            </template>

                            <!-- 1. Display Existing Employees -->
                            <template x-for="(item, index) in basket.existing_employees" :key="'e-' + item.id">
                                <div class="list-group-item d-flex justify-content-between align-items-center py-2">
                                    <div class="d-flex align-items-center gap-3">
                                        <img :src="item.photo_url" alt="Photo" class="rounded-circle" style="width: 35px; height: 35px; object-fit: cover;">
                                        <span>
                                            <i class="bi bi-person-check me-1 text-primary"></i>
                                            <span x-text="item.employeeNameTh"></span>
                                            <span class="text-muted" x-text="item.employeeNameEn ? '(' + item.employeeNameEn + ')' : ''"></span>
                                        </span>
                                    </div>
                                    <button type="button" class="btn btn-sm btn-danger" @click="removeConfirm('existing_employees', index, item.employeeNameTh)">ลบ</button>
                                    <input type="hidden" :name="'attachments[existing_employees][' + index + ']'" :value="item.id">
                                </div>
                            </template>

                            <!-- 1.5 Display External Employees (THE NEW FEATURE) -->
                            <template x-for="(item, index) in basket.external_employees" :key="'ext-' + item.id">
                                <div class="list-group-item d-flex justify-content-between align-items-center py-2 border-warning bg-light" data-testid="external-employee-item">
                                    <div class="d-flex align-items-center gap-3">
                                        <img :src="item.photo_url" alt="Photo" class="rounded-circle" style="width: 35px; height: 35px; object-fit: cover;">
                                        <span>
                                            <i class="bi bi-search me-1 text-warning"></i>
                                            <span x-text="item.employeeNameTh"></span>
                                            <span class="text-muted" x-text="'(Ext)'"></span>
                                        </span>
                                    </div>
                                    <button type="button" class="btn btn-sm btn-danger" @click="removeConfirm('external_employees', index, item.employeeNameTh)">ลบ</button>
                                    <input type="hidden" :name="'attachments[external_employees][' + index + ']'" :value="item.id">
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                        <div class="btn-group" role="group" aria-label="Attachment options">
                            <button type="button" class="btn btn-outline-primary" @click="openExistingEmployeeModal">
                                <i class="bi bi-person-check"></i> แนบลูกจ้าง
                            </button>
                            <!-- THE NEW BUTTON -->
                            <button type="button" class="btn btn-outline-warning text-dark" @click="openGlobalEmployeeSearch" id="btn-external-employees">
                                <i class="bi bi-search"></i> แนบลูกจ้างภายนอก
                            </button>
                            <button type="button" class="btn btn-outline-success" @click="openNewEmployeeModal">
                                <i class="bi bi-person-plus"></i> แจ้งเข้า
                            </button>
                            <button type="button" class="btn btn-outline-secondary" @click="triggerFileInput">
                                <i class="bi bi-paperclip"></i> แนบไฟล์
                            </button>
                        </div>
                    </div>
                </form>

            <!-- Mocked Existing Employee Modal -->
            <div class="modal fade" id="existingEmployeeModal" tabindex="-1" aria-hidden="true">
                <div class="modal-dialog modal-lg">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">เลือกลูกจ้าง</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <div class="input-group mb-3">
                                <span class="input-group-text"><i class="bi bi-search"></i></span>
                                <input type="text" class="form-control" placeholder="ค้นหา..." x-model.debounce.500ms="searchQuery">
                            </div>

                            <div class="list-group">
                                <template x-for="emp in availableEmployees" :key="emp.id">
                                    <label class="list-group-item">
                                        <input class="form-check-input me-1" type="checkbox" :value="emp.id" x-model="selectedEmployeeIds">
                                        <span x-text="emp.employeeNameTh"></span>
                                        <span class="badge bg-secondary" x-text="emp.employer_id == contextEmployerId ? 'Affiliated' : 'External'"></span>
                                    </label>
                                </template>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-primary" @click="confirmSelection" id="btn-confirm-selection">ยืนยันเลือก</button>
                        </div>
                    </div>
                </div>
            </div>

            </div>
        </div>

    </div>

    <!-- Hybrid Script -->
    <script>
    function hybridAttachmentManager(config = {}) {
        return {
            basket: { existing_employees: [], external_employees: [], new_employees: [], files: [] },
            isUploading: false,
            uploadProgress: 0,
            filesToUploadCount: 0,
            filesUploadedCount: 0,
            modalInstances: { existing: null, new: null },
            availableEmployees: [],
            selectedEmployeeIds: [],
            isLoading: false,
            searchQuery: '',
            contextEmployerId: config.employerId || null,
            isContextAdminCreate: false,
            isGlobalSearch: false,
            defaultNewEmployeeForm: {},
            newEmployeeForm: {},
            uploadStatus: {},

            init() {
                this.$nextTick(() => {
                    const existingModalEl = document.getElementById('existingEmployeeModal');
                    if (existingModalEl) this.modalInstances.existing = new bootstrap.Modal(existingModalEl);
                });

                this.$watch('searchQuery', (value) => {
                    if (this.isGlobalSearch && value.length > 1) {
                        this.fetchEmployees();
                    }
                });

                this.$watch('isGlobalSearch', (value) => {
                    this.searchQuery = '';
                    this.availableEmployees = [];
                });
            },

            async fetchEmployees() {
                // MOCK FETCH
                console.log('Fetching employees... Global:', this.isGlobalSearch);
                this.isLoading = true;

                // Simulate network delay
                await new Promise(r => setTimeout(r, 200));

                // Mock Data
                const mockData = [
                    { id: 1, employeeNameTh: 'Somchai (Local)', employer_id: 123, photo_url: 'https://via.placeholder.com/35' },
                    { id: 2, employeeNameTh: 'Somsak (External)', employer_id: 999, photo_url: 'https://via.placeholder.com/35' }
                ];

                if (this.isGlobalSearch) {
                    this.availableEmployees = mockData; // Return all for global search test
                } else {
                    this.availableEmployees = mockData.filter(e => e.employer_id == this.contextEmployerId);
                }

                this.isLoading = false;
            },

            openExistingEmployeeModal() {
                this.isGlobalSearch = false;
                this.searchQuery = '';
                this.fetchEmployees();
                if (this.modalInstances.existing) this.modalInstances.existing.show();
            },

            openGlobalEmployeeSearch() {
                this.isGlobalSearch = true;
                this.searchQuery = '';
                this.availableEmployees = [];
                if (this.modalInstances.existing) this.modalInstances.existing.show();
            },

            confirmSelection() {
                this.selectedEmployeeIds.forEach(id => {
                    const employee = this.availableEmployees.find(e => e.id == id);
                    if (!employee) return;

                    const isAffiliated = this.contextEmployerId && (employee.employer_id == this.contextEmployerId);
                    const targetBasket = isAffiliated ? this.basket.existing_employees : this.basket.external_employees;

                    if (!targetBasket.some(e => e.id == employee.id)) {
                        targetBasket.push(JSON.parse(JSON.stringify(employee)));
                    }
                });
                this.selectedEmployeeIds = [];
                if (this.modalInstances.existing) this.modalInstances.existing.hide();
            },

            totalItemsCount() {
                return this.basket.existing_employees.length +
                       this.basket.external_employees.length +
                       this.basket.new_employees.length +
                       this.basket.files.length;
            },

            removeConfirm(type, index, name) {
                if (confirm('Remove ' + name + '?')) {
                    this.basket[type].splice(index, 1);
                }
            },

            // Placeholders
            openNewEmployeeModal() {},
            triggerFileInput() {},
            handleGeneralFileUpload() {},
            restoreOldInput() {},
            resetNewEmployeeForm() {}
        }
    }
    </script>
</body>
</html>
