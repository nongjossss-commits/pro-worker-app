<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cropper Verification</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
</head>
<body>
    <div class="container mt-5">
        <h1>Cropper Verification</h1>
        <!-- Button to trigger modal -->
        <button type="button" class="btn btn-primary" id="triggerBtn">Open Modal</button>

        <!-- Mock Inputs -->
        <input type="file" id="triggerFile" style="display:none;">
        <input type="file" id="triggerCamera" style="display:none;">
        <input type="file" id="employeePhotoInput" style="display:none;">
        <img id="employeePhotoPreview" src="" alt="Preview" class="mt-3" style="max-width: 200px; display: block;">

        <!-- Cropper Modal (Replicating index.blade.php structure) -->
        <div class="modal fade" id="cropperModal" tabindex="-1" aria-labelledby="cropperModalLabel" aria-hidden="true" style="z-index: 1060;">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="cropperModalLabel">ครอบตัดรูปภาพ</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <style>
                            .img-container {
                                max-height: 500px;
                                display: block;
                            }
                            .img-container img {
                                max-width: 100%;
                                display: block;
                            }
                        </style>
                        <div class="img-container">
                            <img id="imageToCrop" src="" alt="Picture" style="display: block; max-width: 100%;">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">ยกเลิก</button>
                        <button type="button" class="btn btn-primary" id="cropImageBtn">ครอบตัดและบันทึก</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Test Script simulating the environment -->
    <script>
        // Mock initEmployeeEditForm related elements (partial)
        // We only care about the cropper logic part
        const cropperModalEl = document.getElementById('cropperModal');
        const imageToCrop = document.getElementById('imageToCrop');
        const cropImageBtn = document.getElementById('cropImageBtn');
        const employeePhotoPreview = document.getElementById('employeePhotoPreview');
        const actualInput = document.getElementById('employeePhotoInput');
        let cropper;
        let originalFile;

        // Mock a file for "originalFile" so the save logic works
        originalFile = new File(["dummy content"], "test.jpg", { type: "image/jpeg" });

        // --- The Logic being Tested (Copied from _edit_scripts.blade.php with modifications) ---
        // I will copy the exact logic I modified in the previous step

        cropperModalEl.addEventListener('shown.bs.modal', function () {
            // Disable save button until cropper is ready
            if(cropImageBtn) cropImageBtn.disabled = true;

            // Destroy existing cropper if any to be safe
            if (cropper) {
                cropper.destroy();
                cropper = null;
            }

            // Ensure image is loaded and ready
            if (imageToCrop.complete) {
                initCropper();
            } else {
                imageToCrop.onload = function() {
                    initCropper();
                };
            }
        });

        function initCropper() {
            if (typeof Cropper === 'undefined') {
                alert('ไม่สามารถโหลดเครื่องมือตัดภาพได้ (Cropper.js) กรุณาตรวจสอบการเชื่อมต่ออินเทอร์เน็ต');
                return;
            }

            try {
                cropper = new Cropper(imageToCrop, {
                    aspectRatio: 150 / 180,
                    viewMode: 1,
                    dragMode: 'move',
                    background: false,
                    autoCropArea: 0.8,
                    movable: true,
                    zoomable: true,
                    rotatable: true,
                    scalable: true,
                    cropBoxMovable: true,
                    cropBoxResizable: true,
                    minCropBoxWidth: 50,
                    minCropBoxHeight: 50,
                    checkCrossOrigin: false,
                    ready: function () {
                        // Enable save button when cropper is ready
                        console.log('Cropper is ready!');
                        if(cropImageBtn) cropImageBtn.disabled = false;
                    },
                });
            } catch (err) {
                console.error(err);
                alert('เกิดข้อผิดพลาดในการเริ่มทำงาน Cropper: ' + err.message);
            }
        }

        // Clean up
        cropperModalEl.addEventListener('hidden.bs.modal', function () {
            if (cropper) {
                cropper.destroy();
                cropper = null;
            }
            imageToCrop.src = '';
        });

        // Save logic
        const newCropBtn = cropImageBtn.cloneNode(true);
        cropImageBtn.parentNode.replaceChild(newCropBtn, cropImageBtn);

        newCropBtn.addEventListener('click', function () {
            if (!cropper) {
                alert('กรุณารอให้เครื่องมือตัดภาพทำงาน หรือลองเลือกไฟล์ใหม่');
                return;
            }

            const canvas = cropper.getCroppedCanvas({
                width: 300,
                height: 360,
                minWidth: 200,
                minHeight: 200,
                imageSmoothingQuality: 'high',
            });

            if (!canvas) {
                alert('เกิดข้อผิดพลาดในการตัดภาพ (Canvas creation failed). กรุณาลองใหม่อีกครั้ง');
                return;
            }

            console.log('Canvas created successfully!');
            // Visualize result
            employeePhotoPreview.src = canvas.toDataURL();

            // Close modal (simulated)
            const modal = bootstrap.Modal.getInstance(cropperModalEl);
            modal.hide();
        });

        // Trigger logic
        document.getElementById('triggerBtn').addEventListener('click', () => {
             // Set a dummy image
             imageToCrop.src = 'https://picsum.photos/id/64/500/500'; // Portrait-ish
             const modal = new bootstrap.Modal(cropperModalEl);
             modal.show();
        });
    </script>
</body>
</html>
