<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header Verification</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { padding: 20px; background-color: #f8fafc; }
    </style>
</head>
<body>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="d-flex align-items-center gap-2">
            <button class="btn btn-primary" type="button">
                <i class="bi bi-list"></i>
            </button>
            <button class="btn btn-outline-secondary d-none d-md-block">
                <i class="bi bi-cloud-download-fill me-1"></i> Download Center
            </button>
        </div>

        <div class="d-flex align-items-center ms-auto gap-2">
            <!-- Language Switcher (Should be First) -->
            <div class="dropdown">
                <button class="btn btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="bi bi-translate me-1"></i>
                    🇺🇸 English
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item" href="#">🇹🇭 ไทย (Thai)</a></li>
                    <li><a class="dropdown-item" href="#">🇺🇸 English</a></li>
                    <li><a class="dropdown-item" href="#">🇨🇳 中文 (Chinese)</a></li>
                </ul>
            </div>

            <!-- User Dropdown (Should be Second) -->
            <div class="dropdown">
                <button class="btn btn-outline-secondary dropdown-toggle d-flex align-items-center gap-2" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="bi bi-person-circle"></i>
                    <span class="d-none d-md-inline">Test User</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li>
                        <a href="#" class="dropdown-item text-danger">
                            <i class="bi bi-box-arrow-right me-2"></i>Logout
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
