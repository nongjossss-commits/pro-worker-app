
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Verification Drawer Mock</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    </head>
    <body class="p-4 bg-light">
        <div class="container">
            <h4>Mock Custom Fields Drawer</h4>

            <div class="card mb-3" style="max-width: 500px;">
                <div class="card-body">
                    <div class="employee-drawer-content">
                        <h6 class="fw-bold border-bottom pb-2 mb-3">Custom Fields</h6>

                        <div class="custom-fields-list mb-4 custom-fields-container">
                             <!-- Item 1: Text Field -->
                             <div class="mb-3 border-bottom pb-2 field-item">
                                <div class="d-flex justify-content-between align-items-start">
                                    <label class="form-label fw-bold small mb-1 text-secondary text-truncate" style="max-width: 70%;">My Text Field</label>
                                    <div class="dropdown">
                                        <button class="btn btn-link btn-sm p-0 text-muted"><i class="bi bi-three-dots-vertical"></i></button>
                                    </div>
                                </div>
                                <div>
                                    <p class="mb-1 bg-white p-2 border rounded small text-break">Sample Text Value</p>
                                </div>
                             </div>

                             <!-- Item 2: File Field (Target for Verification) -->
                             <div class="mb-3 border-bottom pb-2 field-item">
                                <div class="d-flex justify-content-between align-items-start">
                                    <label class="form-label fw-bold small mb-1 text-secondary text-truncate" style="max-width: 70%;">My Document</label>
                                    <div class="dropdown">
                                        <button class="btn btn-link btn-sm p-0 text-muted"><i class="bi bi-three-dots-vertical"></i></button>
                                    </div>
                                </div>
                                <div>
                                    <div class="d-flex align-items-center justify-content-between gap-2 mb-1 bg-white p-2 border rounded">
                                        <div class="d-flex align-items-center gap-2 text-truncate">
                                            <i class="bi bi-paperclip text-muted"></i>
                                            <span class="small text-secondary text-truncate" style="max-width: 150px;">Attachment</span>
                                        </div>
                                        <div class="d-flex gap-1">
                                            <a href="#" class="btn btn-sm btn-success text-white rounded-circle shadow-sm d-flex align-items-center justify-content-center flex-shrink-0" style="width: 32px; height: 32px;" title="View File">
                                                <i class="bi bi-eye-fill"></i>
                                            </a>
                                            <!-- THE RED BUTTON WE ADDED -->
                                            <a href="#" class="btn btn-sm btn-danger text-white rounded-circle shadow-sm d-flex align-items-center justify-content-center flex-shrink-0" style="width: 32px; height: 32px;" title="Download PDF">
                                                <i class="bi bi-file-earmark-pdf-fill"></i>
                                            </a>
                                        </div>
                                    </div>
                                    <div class="small text-muted fst-italic text-break mt-1">Uploaded document</div>
                                </div>
                             </div>

                        </div>

                        <div class="d-grid">
                            <button class="btn btn-outline-primary btn-sm">
                                <i class="bi bi-plus-lg"></i> Add New Field
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
    </html>
