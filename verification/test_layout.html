<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Test</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        :root {
            --bs-primary: #F97316;
            --bs-primary-rgb: 249, 115, 22;
            --bs-primary-dark: #EA580C;
            --bs-primary-light: #FB923C;
            --bs-body-font-family: 'Inter', 'Sarabun', sans-serif;
            --bs-body-bg: #f8fafc;
            --bs-border-color: #e2e8f0;
        }
        body {
            font-size: 1rem;
            line-height: 1.6;
            background-color: var(--bs-body-bg);
            font-family: var(--bs-body-font-family);
        }
        .main-layout { display: flex; min-height: 100vh; }
        #sidebar {
            width: 260px;
            background-color: #ffffff;
            box-shadow: 0 1px 3px rgba(0,0,0,.05);
            display: flex; flex-direction: column; flex-shrink: 0;
        }
        #main-content { flex-grow: 1; padding: 2.5rem; }
        .list-group-item { border: none; padding: 0.75rem 1rem; margin-bottom: 0.5rem; }
        .list-group-item.active { background-color: var(--bs-primary-light); color: white; }
    </style>
</head>
<body>
    <div class="main-layout">
        <aside id="sidebar" class="d-none d-lg-flex">
            <div class="p-3">
                <h4>Company Records</h4>
            </div>
            <div class="list-group px-2">
                <a href="#" class="list-group-item list-group-item-action active"><i class="bi bi-pie-chart-fill me-2"></i>Dashboard</a>
                <a href="#" class="list-group-item list-group-item-action"><i class="bi bi-people-fill me-2"></i>Employees</a>
            </div>
        </aside>

        <main id="main-content" style="position: relative; z-index: 1;">
            <!-- Header Area -->
            <div class="d-flex justify-content-between align-items-center mb-3">
                <button class="btn btn-primary d-none d-lg-block">
                    <i class="bi bi-list me-2"></i> Open Menu
                </button>

                <!-- Language Switcher -->
                <div class="d-flex align-items-center ms-auto">
                     <div class="dropdown">
                        <button class="btn btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-translate me-1"></i> 🇺🇸 English
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#">🇹🇭 ไทย (Thai)</a></li>
                            <li><a class="dropdown-item" href="#">🇺🇸 English</a></li>
                            <li><a class="dropdown-item" href="#">🇨🇳 中文 (Chinese)</a></li>
                        </ul>
                    </div>
                </div>
            </div>

            <div class="content-section bg-white p-4 rounded border">
                <h3>Main Content Area</h3>
                <p>This is where the dashboard content would go.</p>
            </div>
        </main>
    </div>
</body>
</html>
