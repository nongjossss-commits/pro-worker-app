<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="csrf-token" content="mock-token">
    <title>Bulk Edit Test</title>
</head>
<body>
    <h1>Bulk Edit Script Loading Verification</h1>
    <div id="bulkEditForm">
        <!-- Mock Elements needed by the script -->
        <input type="file" id="globalTriggerFile">
        <input type="file" id="globalTriggerCamera">
        <button class="btn-crop-trigger" data-employee-id="1" data-action="file">Select File</button>
        <div id="cropperModal" class="modal fade"></div>
        <img id="imageToCrop">
        <div id="preview-img-1"></div>
        <input type="file" id="photo-input-1">
    </div>

    <!-- The Modified Inline Script (Wrapped in DOMContentLoaded) -->
    <!-- This mimics exactly what we put in the blade file -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log("DOMContentLoaded event fired.");

            // This logic mimics the one in the blade file which tries to use bootstrap immediately
            if (typeof bootstrap === 'undefined') {
                console.error("FAIL: bootstrap is not defined inside DOMContentLoaded!");
                const statusDiv = document.createElement('div');
                statusDiv.id = 'test-status';
                statusDiv.style.color = 'red';
                statusDiv.textContent = 'FAIL: bootstrap undefined';
                document.body.appendChild(statusDiv);
                return;
            }

            try {
                const cropperModalEl = document.getElementById('cropperModal');
                const cropperModal = new bootstrap.Modal(cropperModalEl);
                console.log("Bootstrap Modal initialized successfully.");

                const statusDiv = document.createElement('div');
                statusDiv.id = 'test-status';
                statusDiv.style.color = 'green';
                statusDiv.textContent = 'SUCCESS: Bootstrap loaded and Modal initialized';
                document.body.appendChild(statusDiv);
            } catch (e) {
                console.error(e);
                const statusDiv = document.createElement('div');
                statusDiv.id = 'test-status';
                statusDiv.style.color = 'red';
                statusDiv.textContent = 'FAIL: Exception thrown ' + e.message;
                document.body.appendChild(statusDiv);
            }
        });
    </script>

    <!-- Simulated App.js loading Bootstrap -->
    <!-- We use type="module" to simulate the deferred loading behavior of Vite -->
    <script type="module">
        console.log("Simulated App.js (module) executing...");

        // Mock Bootstrap
        window.bootstrap = {
            Modal: class {
                constructor(element) {
                    this.element = element;
                    console.log("Bootstrap Modal created for", element);
                }
                show() {}
                hide() {}
            },
            Collapse: {
                getOrCreateInstance: () => ({ show: () => {}, hide: () => {} })
            }
        };
        console.log("window.bootstrap is now set.");
    </script>
</body>
</html>
