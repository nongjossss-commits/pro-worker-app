
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar Verification</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --bs-primary: #F97316;
            --bs-primary-rgb: 249, 115, 22;
            --bs-primary-dark: #EA580C;
            --bs-primary-light: #FB923C;
            --bs-body-font-family: 'Inter', 'Sarabun', sans-serif;
            --bs-body-bg: #f8fafc;
            --bs-border-color: #e2e8f0;
        }
        body {
            font-size: 1rem;
            line-height: 1.6;
            background-color: var(--bs-body-bg);
            font-family: var(--bs-body-font-family);
        }
        .main-layout {
            display: flex;
            min-height: 100vh;
        }
        #sidebar {
            width: 260px;
            background-color: #ffffff;
            box-shadow: 0 1px 3px rgba(0,0,0,.05);
            --bs-offcanvas-width: 260px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        #sidebar .navbar-brand {
            font-weight: 700;
            color: var(--bs-primary);
            margin-bottom: 1.5rem;
            text-align: center;
            font-size: 1.5rem;
            text-decoration: none;
        }
        #sidebar .list-group-item {
            border: none;
            padding: 0.75rem 1rem;
            margin-bottom: 0.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            color: #475569;
        }
        #sidebar .offcanvas-body {
            padding: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="main-layout">
        <aside id="sidebar" class="offcanvas offcanvas-start show" tabindex="-1" style="visibility: visible; position: relative;">
            <div class="offcanvas-body d-flex flex-column p-0">
                <a class="navbar-brand d-flex flex-column align-items-center mb-4 mt-3" href="#">
                    <!-- Mocking the updated logo style -->
                    <img src="https://via.placeholder.com/130x130.png?text=Logo" alt="Proworker Logo" class="mb-2" style="height: 130px; width: auto; max-width: 100%; border: none;">
                    <span style="line-height: 1.2;">Proworker labour</span>
                </a>
                <div class="list-group" id="main-nav">
                    <a href="#" class="list-group-item list-group-item-action"><i class="bi bi-pie-chart-fill me-2"></i>Dashboard</a>
                    <a href="#" class="list-group-item list-group-item-action"><i class="bi bi-people-fill me-2"></i>Employees</a>
                </div>
            </div>
        </aside>
        <main class="p-4">
            <h1>Main Content</h1>
        </main>
    </div>
</body>
</html>
