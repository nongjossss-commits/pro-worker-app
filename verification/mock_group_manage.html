<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock Group Manage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --bs-primary: #F97316;
            --bs-primary-light: #FB923C;
        }
        .nav-link.active {
            color: #495057;
            background-color: #fff;
            border-color: #dee2e6 #dee2e6 #fff;
        }
        /* CSS Fix from my changes */
        .teams-accordion .accordion-collapse.collapse {
            visibility: visible !important;
        }
        .teams-accordion .accordion-button:not(.collapsed) {
            background-color: var(--bs-primary-light);
            color: white;
        }
    </style>
</head>
<body class="bg-light p-4">
    <div class="container">
        <h1>Independent Groups Management (Mock)</h1>

        <!-- Tabs -->
        <ul class="nav nav-tabs mb-3">
            <li class="nav-item">
                <a class="nav-link active" href="#">Group A (Active)</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">Group B</a>
            </li>
        </ul>

        <!-- Content -->
        <div class="tab-content bg-white border border-top-0 p-3 rounded-bottom shadow-sm">
            <div class="tab-pane fade show active">
                <div class="d-flex justify-content-between align-items-center mb-3 bg-light p-3 rounded">
                    <h4>Group A <span class="text-muted fs-6">(Group)</span></h4>
                    <button class="btn btn-outline-primary btn-sm">Create Team</button>
                </div>

                <div class="accordion shadow-sm teams-accordion" id="accordionGroup1">
                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseTeam1">
                                Team Alpha (Collapsed)
                            </button>
                        </h2>
                        <div id="collapseTeam1" class="accordion-collapse collapse">
                            <div class="accordion-body">
                                Content...
                            </div>
                        </div>
                    </div>
                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseTeam2">
                                Team Beta (Expanded)
                            </button>
                        </h2>
                        <div id="collapseTeam2" class="accordion-collapse collapse show">
                            <div class="accordion-body">
                                <div class="list-group">
                                    <div class="list-group-item">Employee 1</div>
                                    <div class="list-group-item">Employee 2</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
