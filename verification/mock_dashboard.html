<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #sidebar {
            width: 260px;
            --bs-offcanvas-width: 260px;
            background: #f0f0f0;
        }
    </style>
</head>
<body>
    <div class="main-layout d-flex">
        <aside id="sidebar" class="offcanvas-lg offcanvas-start" tabindex="-1" aria-labelledby="sidebarLabel">
            <div class="offcanvas-header d-lg-none">
                <h5 class="offcanvas-title" id="sidebarLabel">Sidebar</h5>
                <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#sidebar" aria-label="Close"></button>
            </div>
            <div class="offcanvas-body d-flex flex-column p-3">
                <div class="list-group">
                    <a href="#" class="list-group-item list-group-item-action">Dashboard</a>
                    <a href="#" class="list-group-item list-group-item-action">Employees</a>
                    <a href="#" class="list-group-item list-group-item-action">Settings</a>
                </div>
            </div>
        </aside>
        <main class="flex-grow-1 p-3">
            <button class="navbar-toggler d-lg-none mb-3" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar">
                Toggle Sidebar
            </button>
            <h1>Dashboard Content</h1>
            <p>This is the dashboard content.</p>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- The script I added to dashboard.blade.php -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const initMobileSidebar = () => {
                // Check if we are on mobile/tablet (Bootstrap lg breakpoint is 992px)
                if (window.innerWidth < 992) {
                    const sidebarEl = document.getElementById('sidebar');

                    if (sidebarEl && typeof bootstrap !== 'undefined') {
                        // Get or create the Offcanvas instance
                        const bsOffcanvas = bootstrap.Offcanvas.getOrCreateInstance(sidebarEl);

                        // Show the sidebar (waiting state)
                        console.log("Attempting to show sidebar");
                        bsOffcanvas.show();

                        // Select all links inside the sidebar
                        const links = sidebarEl.querySelectorAll('a');
                        links.forEach(link => {
                            link.addEventListener('click', () => {
                                // Hide the sidebar when a user selects a menu item
                                console.log("Link clicked, hiding sidebar");
                                bsOffcanvas.hide();
                            });
                        });
                    } else if (typeof bootstrap === 'undefined') {
                        // If bootstrap is not yet loaded, retry shortly
                        console.log("Bootstrap not ready, retrying...");
                        setTimeout(initMobileSidebar, 50);
                    }
                }
            };

            // Initialize the logic
            initMobileSidebar();
        });
    </script>
</body>
</html>
