<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Detail Mock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --bs-primary: #F97316;
        }
        body {
            font-family: 'Inter', 'Sarabun', sans-serif;
            background-color: #f8fafc;
            padding: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Ticket Detail #123</h2>

    <div class="card mb-4 border-info">
        <div class="card-header bg-info text-white">
            <h5 class="mb-0"><i class="bi bi-paperclip me-2"></i>Attachments Triage</h5>
        </div>
        <div class="card-body">

            <h6 class="text-primary mt-3">Existing Employees (2)</h6>

            <!-- Bulk Action Bar (This is what we added) -->
            <div id="ticket-employer-existing-employees-bar" class="d-flex flex-column flex-md-row justify-content-between align-items-center mb-3 py-2 px-3 bg-light border rounded gap-2">
                <div>
                    <input class="form-check-input" type="checkbox" id="select-all-1">
                    <label class="form-check-label ms-2" for="select-all-1">Select All</label>
                </div>
                <div class="dropdown">
                     <button class="btn btn-primary btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown">
                        Action on selected items
                    </button>
                    <ul class="dropdown-menu">
                        <!-- The Advanced Export Button -->
                        <li><a class="dropdown-item" href="#" id="ticket-existing-bulk-advanced-export-btn"><i class="bi bi-file-earmark-spreadsheet me-2"></i>Advanced Export</a></li>
                    </ul>
                </div>
            </div>

            <div class="list-group mb-3">
                <div class="list-group-item d-flex align-items-center gap-3 py-2">
                    <div class="form-check mb-0">
                        <input class="form-check-input employee-checkbox" type="checkbox" value="101">
                    </div>
                    <span><strong>Employee A</strong></span>
                </div>
                <div class="list-group-item d-flex align-items-center gap-3 py-2">
                    <div class="form-check mb-0">
                        <input class="form-check-input employee-checkbox" type="checkbox" value="102">
                    </div>
                    <span><strong>Employee B</strong></span>
                </div>
            </div>

        </div>
    </div>

    <!-- Advanced Export Modal Mock -->
    <div class="modal fade" id="advancedExportModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Advanced Export Options</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>Exporting IDs: <input type="text" id="export_employee_ids" readonly class="form-control"></p>
                </div>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Mocking the JS added to tickets/show.blade.php
    document.addEventListener('DOMContentLoaded', function () {
        const bulkExportBtn = document.getElementById('ticket-existing-bulk-advanced-export-btn');
        if (bulkExportBtn) {
            bulkExportBtn.addEventListener('click', function(e) {
                e.preventDefault();
                const selected = Array.from(document.querySelectorAll('.employee-checkbox:checked')).map(cb => cb.value);

                if (selected.length === 0) {
                    alert('Please select employees first.');
                    return;
                }

                document.getElementById('export_employee_ids').value = JSON.stringify(selected);
                const modalEl = document.getElementById('advancedExportModal');
                const modal = new bootstrap.Modal(modalEl);
                modal.show();
            });
        }
    });
</script>
</body>
</html>
